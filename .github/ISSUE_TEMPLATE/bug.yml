name: Report a bug
description: A reproducible error, a wrong result, or a performance problem
title: "[Bug] "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please give the smallest reproduction you can, with the original output. Do not paste keys, tokens or personal data.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What actually happened, and why does it get in the way?
      placeholder: One or two sentences.
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: Dataset and version
      description: The dataset id you were querying. "Not sure" is a fine answer.
      placeholder: <dataset-id>
    validations:
      required: true

  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point
      options:
        - CLI / docatlas.ps1
        - Python API
        - MCP
        - Skill
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The commands, the input, and the fewest steps that reproduce it reliably.
      render: powershell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Keep the original error, the timings and how often it repeats. Remove anything sensitive first.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: The correct behaviour as a user can observe and verify it, without prescribing the internals.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Optional. "None" is a fine answer.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed keys, tokens, account details and personal data.
          required: true
        - label: I searched the existing issues and found no duplicate.
          required: true
