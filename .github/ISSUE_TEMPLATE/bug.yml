name: 报告问题
description: 报告可以复现的错误、异常结果或性能问题
title: "[Bug] "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供最小复现和原始输出；不要粘贴密钥、Token 或私人数据。

  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 实际发生了什么，它为什么影响使用？
      placeholder: 用一两句话说明问题。
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: 数据集与版本
      description: 例如 epic-ue-5.8；不知道可以写“不确定”。
      placeholder: epic-ue-5.8
    validations:
      required: true

  - type: dropdown
    id: entrypoint
    attributes:
      label: 使用入口
      options:
        - CLI / docatlas.ps1
        - Python API
        - MCP
        - Skill
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 写明命令、输入和可以稳定重现问题的最少步骤。
      render: powershell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请保留原始错误、耗时和重复次数；敏感内容请先删除。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 描述用户能够观察和验证的正确行为，不预先指定内部实现。
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 临时绕行
      description: 可选；如果没有可用绕行方式，可以写“暂无”。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经移除密钥、Token、账号信息和私人数据。
          required: true
        - label: 我已经搜索现有 Issues，暂未发现相同问题。
          required: true
