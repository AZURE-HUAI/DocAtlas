name: Propose an enhancement
description: A direction for improving capability, experience, architecture or process
title: "[Enhancement] "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        An enhancement describes the outcome you want improved. You are not expected to design the final solution.

  - type: textarea
    id: background
    attributes:
      label: Background
      description: What is the current capability or limitation, and why is it worth discussing?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The user-visible outcome you want improved, without committing to an implementation.
    validations:
      required: true

  - type: textarea
    id: directions
    attributes:
      label: Possible directions
      description: Optional. Directions and trade-offs worth thinking about, not settled plans.

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What this does not ask to solve, so the scope stays contained.

  - type: textarea
    id: validation
    attributes:
      label: How to verify
      description: How would we later tell whether this enhancement actually worked?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: This proposal states goals and constraints rather than demanding one implementation.
          required: true
