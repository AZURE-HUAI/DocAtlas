name: Validate issue records

on:
  pull_request:
    paths:
      - "issues/**"
      - "scripts/validate-issues.ps1"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/validate-issues.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "issues/**"
      - "scripts/validate-issues.ps1"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/validate-issues.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate YAML syntax
        shell: bash
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }'
          .github/ISSUE_TEMPLATE/*.yml .github/workflows/*.yml

      - name: Validate issue records
        shell: pwsh
        run: ./scripts/validate-issues.ps1
